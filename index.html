<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font:14px system-ui,sans-serif}
#map{position:absolute;inset:0 290px 0 0;background:#1b2a33}
#side{position:absolute;top:0;right:0;bottom:0;width:290px;box-sizing:border-box;padding:12px;overflow:auto;background:#22272b;color:#e8e6e1}
h3{margin:14px 0 6px;font-size:13px;font-weight:600;color:#9fb3bd}
button,select,input,textarea{font:inherit}
button{background:#33404a;color:#e8e6e1;border:1px solid #4a5a66;border-radius:4px;padding:5px 9px;cursor:pointer}
button:hover{background:#3d4d59}button.on{background:#c9a24a;color:#1b1b1b;border-color:#c9a24a}
.tools{display:flex;gap:6px}.tools button{flex:1}
.row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid #333c44}
.row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row input[type=range]{width:70px}
.opt{display:flex;gap:6px;align-items:center;margin:6px 0}
.opt select{flex:1;min-width:0}
.pop input,.pop textarea{width:200px;box-sizing:border-box;margin-bottom:5px;display:block}
.pin{font-size:26px;line-height:1;filter:drop-shadow(0 1px 2px #000)}
@media(max-width:700px){#map{right:0;bottom:45%}#side{top:55%;width:auto;left:0}}
</style></head>
<body>
<div id="map"></div>
<div id="side">
  <h3>Tool</h3>
  <div class="tools"><button id="t-pan" class="on">Pan</button><button id="t-marker">Marker</button><button id="t-draw">Draw</button></div>
  <div class="opt">Icon <select id="iconSel"><option value="">Default pin</option></select></div>
  <div class="opt"><label>Upload PNG icon <input id="up" type="file" accept="image/png"></label></div>
  <div class="opt">Pen <input id="col" type="color" value="#ff4d4d"> <input id="wt" type="range" min="1" max="20" value="4"></div>
  <h3>Layers <small>(radio = where new things go)</small></h3>
  <div id="layers"></div>
  <button id="addLayer" style="margin-top:8px">Add layer</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>

const firebaseConfig = {
  apiKey: "AIzaSyBJrP14df_oI97t9_sw4TWV0wjJLOWPaVE", authDomain: "skyrim-d575e.firebaseapp.com", databaseURL: "https://skyrim-d575e-default-rtdb.firebaseio.com",
  projectId: "skyrim-d575e", appId: "1:3897435298:web:357a1afb1860f7f5fee3fb"
};
// MAP VALUES
const W = 30720, H = 24064, MAXZ = 7;

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const $ = id => document.getElementById(id);

const map = L.map('map', {crs: L.CRS.Simple, minZoom: 0, maxZoom: MAXZ + 1});
const bounds = L.latLngBounds(map.unproject([0, H], MAXZ), map.unproject([W, 0], MAXZ));
L.tileLayer('mymap/{z}/{y}/{x}.png', {bounds, noWrap: true, maxNativeZoom: MAXZ, tileSize: 256}).addTo(map);
map.fitBounds(bounds); map.setMaxBounds(bounds.pad(0.2));

const layers = {}, icons = {}, items = {}, groups = {}, objs = {}, local = {};
let tool = 'pan', active = null, justAdded = null;
const st = id => local[id] || (local[id] = {visible: true, opacity: 1});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// tools
function setTool(t) {
  tool = t;
  ['pan','marker','draw'].forEach(n => $('t-' + n).classList.toggle('on', n === t));
  map.dragging[t === 'draw' ? 'disable' : 'enable']();
  map.getContainer().style.cursor = t === 'pan' ? '' : 'crosshair';
}
['pan','marker','draw'].forEach(n => $('t-' + n).onclick = () => setTool(n));

// layers
function group(id) {
  if (!groups[id]) { groups[id] = L.layerGroup(); if (st(id).visible) groups[id].addTo(map); }
  return groups[id];
}
function applyOpacity(id) {
  const op = st(id).opacity;
  group(id).eachLayer(o => o.setOpacity ? o.setOpacity(op) : o.setStyle({opacity: op}));
}
function renderLayers() {
  const box = $('layers'); box.innerHTML = '';
  for (const id in layers) {
    const s = st(id), d = document.createElement('div'); d.className = 'row';
    d.innerHTML = `<input type="radio" name="act" title="Active layer" ${id === active ? 'checked' : ''}>
      <input type="checkbox" title="Visible" ${s.visible ? 'checked' : ''}>
      <span>${esc(layers[id].name)}</span>
      <input type="range" title="Opacity" min="0" max="1" step="0.05" value="${s.opacity}">
      <button title="Delete layer">✕</button>`;
    const [radio, vis, , op, del] = d.children;
    radio.onchange = () => active = id;
    vis.onchange = () => { s.visible = vis.checked; s.visible ? group(id).addTo(map) : map.removeLayer(group(id)); };
    op.oninput = () => { s.opacity = +op.value; applyOpacity(id); };
    del.onclick = () => {
      if (!confirm('Delete layer "' + layers[id].name + '" and everything on it, for everyone?')) return;
      const u = {['layers/' + id]: null};
      for (const k in items) if (items[k].layer === id) u['items/' + k] = null;
      db.ref().update(u);
    };
    box.appendChild(d);
  }
}
$('addLayer').onclick = () => { const n = prompt('Layer name?'); if (n) db.ref('layers').push({name: n}); };

// icons
function mkIcon(iid) {
  if (iid && icons[iid]) return L.icon({iconUrl: icons[iid].data, iconSize: [40, 40], iconAnchor: [20, 20], popupAnchor: [0, -18]});
  return L.divIcon({className: '', html: '<div class="pin">📍</div>', iconSize: [26, 26], iconAnchor: [13, 24], popupAnchor: [0, -22]});
}
$('up').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const k = Math.min(1, 80 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    db.ref('icons').push({name: f.name.replace(/\.\w+$/, ''), data: c.toDataURL('image/png')});
  };
  img.src = URL.createObjectURL(f); e.target.value = '';
};
function renderIconSel() {
  const cur = $('iconSel').value;
  $('iconSel').innerHTML = '<option value="">Default pin</option>' +
    Object.keys(icons).map(k => `<option value="${k}">${esc(icons[k].name)}</option>`).join('');
  $('iconSel').value = cur;
}

// items
function popup(id) {
  const it = items[id], d = document.createElement('div'); d.className = 'pop';
  const n = document.createElement('input'), t = document.createElement('textarea');
  n.placeholder = 'Title'; n.value = it.name || '';
  t.placeholder = 'Notes'; t.rows = 4; t.value = it.note || '';
  const save = document.createElement('button'), del = document.createElement('button');
  save.textContent = 'Save'; del.textContent = 'Delete'; del.style.marginLeft = '6px';
  save.onclick = () => { db.ref('items/' + id).update({name: n.value, note: t.value}); map.closePopup(); };
  del.onclick = () => db.ref('items/' + id).remove();
  d.append(n, t, save, del);
  return d;
}
function removeObj(id) { if (objs[id]) { objs[id]._g.removeLayer(objs[id]); delete objs[id]; } }
function render(id) {
  removeObj(id);
  const it = items[id]; if (!it) return;
  const g = group(it.layer);
  const o = it.type === 'draw'
    ? L.polyline(JSON.parse(it.points), {color: it.color, weight: it.weight})
    : L.marker([it.lat, it.lng], {icon: mkIcon(it.icon), title: it.name || ''});
  o._g = g; o.bindPopup(() => popup(id)); g.addLayer(o); objs[id] = o;
  const op = st(it.layer).opacity;
  o.setOpacity ? o.setOpacity(op) : o.setStyle({opacity: op});
  if (id === justAdded) { justAdded = null; o.openPopup(); }
}

// map interaction
map.on('click', e => {
  if (tool !== 'marker') return;
  if (!active) return alert('Add a layer first.');
  const r = db.ref('items').push();
  justAdded = r.key;
  r.set({layer: active, type: 'marker', lat: e.latlng.lat, lng: e.latlng.lng, icon: $('iconSel').value, name: '', note: ''});
});
let pts = null, line = null;
const rnd = v => Math.round(v * 1000) / 1000;
map.on('mousedown', e => {
  if (tool !== 'draw') return;
  if (!active) return alert('Add a layer first.');
  pts = [[rnd(e.latlng.lat), rnd(e.latlng.lng)]];
  line = L.polyline(pts, {color: $('col').value, weight: +$('wt').value}).addTo(map);
});
map.on('mousemove', e => { if (pts) { pts.push([rnd(e.latlng.lat), rnd(e.latlng.lng)]); line.setLatLngs(pts); } });
document.addEventListener('mouseup', () => {
  if (!pts) return;
  line.remove();
  if (pts.length > 1) db.ref('items').push({layer: active, type: 'draw', points: JSON.stringify(pts),
    color: $('col').value, weight: +$('wt').value, name: '', note: ''});
  pts = null;
});

// realtime sync
db.ref('layers').on('child_added', s => { layers[s.key] = s.val(); if (!active) active = s.key; renderLayers(); });
db.ref('layers').on('child_changed', s => { layers[s.key] = s.val(); renderLayers(); });
db.ref('layers').on('child_removed', s => {
  delete layers[s.key];
  if (groups[s.key]) { map.removeLayer(groups[s.key]); delete groups[s.key]; }
  if (active === s.key) active = Object.keys(layers)[0] || null;
  renderLayers();
});
const itemSet = s => { items[s.key] = s.val(); render(s.key); };
db.ref('items').on('child_added', itemSet);
db.ref('items').on('child_changed', itemSet);
db.ref('items').on('child_removed', s => { delete items[s.key]; removeObj(s.key); });
const iconSet = s => { icons[s.key] = s.val(); renderIconSel(); for (const k in items) if (items[k].icon === s.key) render(k); };
db.ref('icons').on('child_added', iconSet);
db.ref('icons').on('child_changed', iconSet);

db.ref('layers').once('value', s => { if (!s.exists()) db.ref('layers').push({name: 'Layer 1'}); });
</script>
</body></html>
